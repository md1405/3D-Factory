<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Interactive 3D Dairy Factory Tour - Digital Twin Presentation">
  <meta name="author" content="Factory Digital Twin">
  
  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏭</text></svg>">
  
  <title>Dairy Factory 3D Tour | Interactive Plant Visualization</title>

  <script type="module" crossorigin src="/3D-Factory/assets/index-AqeKtFQ7.js"></script>
  <link rel="stylesheet" crossorigin href="/3D-Factory/assets/index-BUrJvZ3U.css">
</head>
<body>
    <!-- ========== Loading Screen ========== -->
    <div id="loading-screen">
        <div class="loading-content">
            <div class="loading-logo">DF</div>
            <div class="spinner"></div>
            <div class="loading-text">Loading Factory Environment...</div>
            <div class="progress-bar-container">
                <div id="progress-bar" class="progress-bar"></div>
            </div>
            <div id="progress-text">0%</div>
        </div>
    </div>

    <!-- ========== Header ========== -->
    <header id="header">
        <div class="logo">
            <div class="logo-icon">🏭</div>
            <span class="logo-text">DAIRY FACTORY</span>
        </div>
        
        <!-- Tour Controls (فقط موقع تور نشون داده میشه) -->
        <div class="actions" id="tour-controls" style="display: none;">
            <button id="tour-prev" class="btn btn-secondary">
                <span class="btn-icon">◀</span>
                Previous
            </button>
            <button id="tour-pause" class="btn btn-primary">
                <span class="btn-icon">⏸</span>
                Pause
            </button>
            <button id="tour-next" class="btn btn-secondary">
                <span class="btn-icon">▶</span>
                Next
            </button>
            <button id="tour-stop" class="btn btn-danger">
                <span class="btn-icon">⏹</span>
                Exit Tour
            </button>
        </div>
        
        <!-- Default Controls (همیشه نشون داده میشه) -->
        <div class="actions" id="default-controls">
            <button id="tour-btn" class="btn btn-primary">
                <span class="btn-icon">▶</span>
                Start Tour
            </button>
            <button id="reset-btn" class="btn btn-secondary">
                <span class="btn-icon">↺</span>
                Reset View
            </button>
            <button id="config-toggle-btn" class="btn btn-secondary">
                <span class="btn-icon">⚙</span>
                Config
            </button>
            <button id="layout-toggle-btn" class="btn btn-secondary">
                <span class="btn-icon">🏗️</span>
                Layout
            </button>
        </div>
    </header>

    <!-- ========== Step Indicator ========== -->
    <div id="step-indicator" style="display: none;">
        <span id="step-text">Step 1 / 4</span>
        <span id="step-divider">—</span>
        <span id="step-name">Raw Milk Storage</span>
    </div>

    <!-- ========== Status Bar ========== -->
    <div id="status-bar">
        <span class="status-dot" id="status-dot"></span>
        <span id="status-text">Ready</span>
    </div>

    <!-- ========== Equipment List Panel (left side, replaces About) ========== -->
    <div id="equipment-panel">
        <div class="equipment-panel-title">Equipment List</div>
        <ul id="equipment-list" class="equipment-list">
            <!-- Dynamically populated by TourManager -->
        </ul>
    </div>

    <!-- ========== Tour Info Panel (bottom center, during tour) ========== -->
    <div id="tour-info">
        <!-- Dynamically populated by TourManager -->
    </div>

  <!-- Canvas container -->
  <canvas class="webgl"></canvas>

  <!-- Info Hint -->
  <div id="hint">
      🖱️ Mouse to rotate | 🔍 Scroll to zoom | ✋ Drag to pan
  </div>



    <!-- ========== Config Panel ========== -->
    <div id="config-panel">
        <div class="config-panel-header">
            <span class="config-panel-title" id="config-title">Equipment Config</span>
            <select id="config-equipment-selector"></select>
        </div>
        <div id="config-content"></div>
        <div id="config-specs"></div>
    </div>

</body>
</html>
